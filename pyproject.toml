[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safetch"
version = "0.1.0"
description = "A small safe download wrapper that verifies a proxy path before invoking wget."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Anthony" }
]
dependencies = [
  "typer>=0.9,<0.13",
  "click>=8.1,<8.2",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
safetch = "safetch.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["safetch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
